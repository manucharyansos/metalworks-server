name: PHP Security CI

on:
  push:
    branches:
      - master
      - security-hardening/server
  pull_request:
    branches:
      - master

jobs:
  php-security-ci:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_DRIVER: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Laravel testing environment
        run: cp .env.example .env

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite, zip
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --no-check-publish --no-interaction

      - name: Audit locked Composer dependencies
        continue-on-error: true
        run: composer audit --locked --no-interaction

      - name: Install PHP dependencies without application scripts
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Run Laravel package discovery explicitly
        shell: bash
        run: |
          set +e
          php artisan package:discover --ansi 2>&1 | tee package-discover.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload Laravel bootstrap diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laravel-bootstrap-diagnostics
          path: package-discover.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Lint application PHP files
        shell: bash
        run: |
          set -euo pipefail
          find app bootstrap config database routes tests \
            -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Boot Laravel and compile route table
        run: php artisan route:list --except-vendor

      - name: Run security route regression tests
        run: php artisan test --filter=SecurityRoutesTest

      - name: Run manager full-access regression tests
        run: php artisan test --filter=ManagerFullAccessTest

      - name: Run profile password regression tests
        run: php artisan test --filter=ProfilePasswordChangeTest

      - name: Run engineer order file regression tests
        run: php artisan test --filter=EngineerOrderFilesTest

      - name: Run CAD model file policy regression tests
        run: php artisan test --filter=CadModelFilePolicyTest

      - name: Run company isolation and membership regression tests
        run: php artisan test --filter=Company

      - name: Run manager-approved registration regression tests
        run: php artisan test --filter=RegistrationRequestsTest

  company-mysql-migration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: metalworks_recovery_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptesting"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_DRIVER: array
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: metalworks_recovery_test
      DB_USERNAME: root
      DB_PASSWORD: testing
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare Laravel testing environment
        run: cp .env.example .env
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, zip
          coverage: none
      - name: Install dependencies without child-process scripts
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Discover packages with proc_open disabled
        run: php -d disable_functions=proc_open artisan package:discover --no-interaction
      - name: Verify interrupted migrations and registration approvals on InnoDB
        run: vendor/bin/phpunit --filter='CompanyMigrationTest|RegistrationRequestsTest|CompanyRegistrationFollowupTest|CompanyStaffAssignmentsTest'
